<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>长图工坊 · 设计工作台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css"></head>
<body><header class="app-header"><a class="brand" href="/"><span class="brand-mark">▤</span><span>长图工坊<small>LONGFORM STUDIO</small></span></a><span class="environment"><i></i>本地工作台</span><div class="header-actions"><span id="save-state" role="status">正在打开工作台</span><button id="open-project" class="button quiet">打开工程</button><button id="import" class="button">＋ 导入需求表</button><button id="export" class="button primary">导出长图 <span>↗</span></button></div></header>
<div class="project-bar"><div><span class="breadcrumb">我的项目 <b>/</b> 长图制作</span><input id="project-name" aria-label="工程名称" value="正在加载…"><span id="stats"></span></div><div class="project-actions"><button id="reference" class="button quiet">▧ 参考原稿</button><button id="download-project" class="button quiet">保存工程包</button></div></div>
<div class="workbench"><aside class="left-panel"><div class="panel-tabs"><button class="active" data-left-tab="outline">模块</button><button data-left-tab="layers">全部图层</button><button data-left-tab="assets">项目素材</button></div><section id="layers-panel" hidden><div class="layer-add"><button class="button" id="add-text-layer">＋ 文字</button><button class="button" id="add-image-layer">＋ 图片 / Logo</button></div><div class="layer-actions"><button class="button danger" id="delete-layer-toolbar" disabled>删除选中</button><button class="button" id="undo-toolbar">↶ 撤销</button></div><input id="layer-search" placeholder="查找图层" aria-label="查找图层"><div id="layer-list"></div></section><section id="outline-panel"><div class="source-card"><span class="file-icon">X</span><div><b>需求文案已导入</b><small id="source-name">保留原文 · 可逐段核对</small></div><span class="check">✓</span></div><div class="section-heading"><span>内容模块 · 拖动排序</span><button id="add-block" title="添加模块" aria-label="添加模块">＋</button></div><nav id="outline"></nav><div class="outline-footer"><span class="tiny-dot"></span>文案修改会应用到三套方案</div></section><section id="assets-panel" hidden><div class="section-heading"><span>素材库</span><button id="upload-asset">＋ 上传</button></div><p class="hint">点击素材可分配用途。人物和游戏截图保留原图。</p><div id="asset-grid"></div></section><div class="left-bottom"><button id="new-sample" class="button quiet">＋ 新建示例工程</button><p>文件保存在本机，关闭后可继续编辑</p></div></aside>
<main class="workspace"><div class="workspace-toolbar"><div id="variant-tabs" class="variant-tabs"></div><div class="canvas-tools"><button class="button quiet" id="toggle-left" title="收起或展开图层面板">图层栏</button><select id="canvas-zoom" aria-label="画布缩放"><option value="fit">适应宽度</option><option value="whole">整图概览</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select><span id="canvas-info"></span><button class="button quiet" id="focus-canvas">专注画布</button><button class="button" id="change-layout">换版式</button><button id="change-skin" class="button">◈ 一键换皮</button><button id="generate" class="button dark">✦ 生成方案</button></div></div><div id="generation-status" hidden role="status"></div><div class="workspace-caption"><div><h1>同一份内容，三种表达</h1><p>选定方向后，点击画面中的内容继续调整。</p></div><span class="mode-tag">1 套严格参考 + 2 套视觉探索</span></div><div class="module-navigation"><button class="button quiet" id="module-undo">↶ 撤销</button><button class="button quiet" id="module-mode">▣ 选择模块</button><select id="module-nav" aria-label="跳转模块"><option>跳转模块…</option></select><span>先选模块，再展开内部图层精修</span></div><div id="canvases" class="canvases"></div><div class="workspace-bottom"><span>画面内滚动浏览完整长图</span><span id="current-font-note">当前为开源预览字体 · 交付前可添加项目指定字体</span></div></main>
<aside class="inspector"><div class="inspector-title"><div><span class="eyebrow">DESIGN SETTINGS</span><h2>方案设置</h2></div><span id="variant-badge">A</span></div><div id="inspector-content"></div></aside></div>
<div id="toast" role="status" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog>
<input type="file" id="typography-reference-input" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="xlsx-input" accept=".xlsx" hidden><input type="file" id="asset-input" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="project-input" accept=".json" hidden><input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2" hidden>
<script type="module" src="/app.js"></script></body></html>
